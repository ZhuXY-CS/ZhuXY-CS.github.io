<svg class="dublin-atlas-svg" viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" {% if include.preview %}aria-hidden="true" focusable="false"{% else %}role="group" aria-label="都柏林完整22邮区与周边地理地图，点击色块查看资料"{% endif %}>
  <defs>
    <filter id="atlas-paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="3" stitchTiles="stitch" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="atlas-sea-ripples" width="84" height="60" patternUnits="userSpaceOnUse"><path d="M12 28 q7 -5 14 0 t14 0" fill="none" stroke="#fff" stroke-width="1" opacity=".4"/></pattern>
    <pattern id="atlas-tidal-sand" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e4d5ad"/><path d="M1 2h2 M5 5h1" stroke="#baaa82" stroke-width=".7"/></pattern>
    <mask id="atlas-unmapped-land"><rect width="900" height="800" fill="black"/><path d="{{ site.data.dublin_geography.land }}" fill="white"/>{% for region in site.data.dublin_geography.regions %}<path d="{{ region.d }}" fill="black"/>{% endfor %}</mask>
    <g id="atlas-pine"><path d="M0 0L-9 20h5l-9 13h9l-8 13h24L4 33h9L4 20h5Z" fill="#8c9b7c" fill-opacity=".55" stroke="#7e8b70" stroke-width=".6"/><path d="M0 22v31" stroke="#9d8c71" stroke-width="1.2"/></g>
    <clipPath id="atlas-land-clip"><path d="{{ site.data.dublin_geography.land }}"/></clipPath>
  </defs>
  <rect width="900" height="800" fill="#bcd5df"/>
  <rect width="900" height="800" fill="url(#atlas-sea-ripples)"/>
  <path d="{{ site.data.dublin_geography.land }}" fill="#eee9d7" stroke="#cbd9d5" stroke-width="0.8" fill-rule="evenodd"/>
  <image href="{{ '/assets/images/zy-and-i/dublin-watercolor.png' | relative_url }}" width="900" height="800" preserveAspectRatio="none" opacity=".72" pointer-events="none"/>
  <text x="855" y="45" text-anchor="end" class="atlas-water-label">N ↑</text>
  <text x="730" y="310" class="atlas-water-label">IRISH SEA</text>
  <text x="730" y="331" class="atlas-water-label">爱尔兰海</text>
  <text x="670" y="425" class="atlas-water-label">DUBLIN BAY</text>
  {% for region in site.data.dublin_geography.regions %}
  <path d="{{ region.d }}" fill="{{ region.color }}" stroke="#fffdfd" stroke-width="0.9" fill-rule="evenodd" class="atlas-region{% if region.code == 'D18' %} is-selected{% endif %}" {% unless include.preview %}data-atlas-region="{{ region.code }}" tabindex="0" role="button" aria-label="查看 Dublin {{ region.label | remove: 'D' }}" aria-pressed="{% if region.code == 'D18' %}true{% else %}false{% endif %}"{% endunless %}>
    <title>Dublin {{ region.label | remove: 'D' }}</title>
  </path>
  {% endfor %}
  <g pointer-events="none" aria-hidden="true">
    <path d="M492 390L572 390L576 452L503 451Z" fill="url(#atlas-tidal-sand)" opacity=".75" mask="url(#atlas-unmapped-land)"/>
    <path d="M520 414 Q548 404 576 415" fill="none" stroke="#ad9974" stroke-width=".8"/>
    <text x="579" y="415" class="atlas-landmark-label">Sandymount</text><text x="579" y="429" class="atlas-landmark-sub">Strand · 潮间带示意</text>
  </g>
  <g class="atlas-landscape" clip-path="url(#atlas-land-clip)" pointer-events="none" aria-hidden="true">
    <g transform="translate(105 400)">
      <path d="M-25 88 Q10 54 40 74T98 77 M-20 97 Q25 84 58 96T110 86 M-30 109 Q12 104 40 114T105 102" fill="none" stroke="#aaa886" stroke-width="1" opacity=".65"/>
      <use href="#atlas-pine" transform="translate(0 32) scale(.7)"/><use href="#atlas-pine" transform="translate(17 42) scale(.5)"/><use href="#atlas-pine" transform="translate(79 43) scale(.65)"/>
      <text x="34" y="-2" text-anchor="middle" class="atlas-landmark-label">向西 · Kildare</text><text x="34" y="16" text-anchor="middle" class="atlas-landmark-sub">田野与小镇的方向</text>
    </g>
    <g transform="translate(335 648)">
      <path d="M0 75 Q38 36 63 12 Q88 34 107 59 Q140 24 161 2 Q196 40 226 75Z" fill="#a5a99b" opacity=".26"/>
      <path d="M0 75L63 12L107 59L161 2L226 75 M42 35L63 12L82 35L70 31L62 39L54 30 M135 28L161 2L185 31L170 23L162 33L152 23" fill="none" stroke="#8f9587" stroke-width="1.1" opacity=".7"/>
      <use href="#atlas-pine" transform="translate(22 61) scale(.65)"/><use href="#atlas-pine" transform="translate(39 73) scale(.4)"/><use href="#atlas-pine" transform="translate(206 60) scale(.7)"/>
      <text x="114" y="106" text-anchor="middle" class="atlas-landmark-label">向南 · Wicklow Mountains</text><text x="114" y="124" text-anchor="middle" class="atlas-landmark-sub">威克洛山地 · 景观示意</text>
    </g>
  </g>
  <rect width="900" height="800" filter="url(#atlas-paper-grain)" opacity=".55" fill="transparent" pointer-events="none"/>
  <g class="atlas-map-letter" aria-hidden="true" pointer-events="none">
    <text x="34" y="115">在这座靠海的城市</text><text x="48" y="143">总有一处，适合我们。</text>
    <path d="M36 165 h40" stroke="#a78b5c" stroke-width="2"/>
    <text x="36" y="191" class="atlas-map-micro">SAME STREETS</text><text x="36" y="208" class="atlas-map-micro">DIFFERENT STORIES</text><text x="36" y="225" class="atlas-map-micro">ALWAYS YOU</text>
    <text x="685" y="697" class="atlas-map-script">More good</text><text x="693" y="721" class="atlas-map-script">days ahead ♡</text>
  </g>
  {% for region in site.data.dublin_geography.regions %}
  {% assign label_x = region.x %}{% assign label_y = region.y %}
  {% if region.code == 'D02' %}{% assign label_x = 552 %}{% assign label_y = 391 %}<path d="M{{ region.x }},{{ region.y }} L{{ label_x | minus: 16 }},{{ label_y }}" class="atlas-label-leader" aria-hidden="true"/>{% endif %}
  <text data-atlas-label="{{ region.code }}" x="{{ label_x }}" y="{{ label_y }}" class="atlas-region-label{% unless region.core %} atlas-context-label{% endunless %}" aria-hidden="true">{{ region.label }}{% unless region.core %}<tspan x="{{ region.x }}" dy="15">{{ region.name }}</tspan>{% endunless %}</text>
  {% endfor %}
  <g class="atlas-context-label"><circle cx="{{ site.data.dublin_geography.bray.x }}" cy="{{ site.data.dublin_geography.bray.y }}" r="3"/><text x="{{ site.data.dublin_geography.bray.x | plus: 9 }}" y="{{ site.data.dublin_geography.bray.y | plus: 4 }}">Bray · 布雷</text></g>
  <g class="atlas-scale" transform="translate(36 750)"><path d="M0,-5 V0 H{{ site.data.dublin_geography.scale5km }} V-5"/><text x="0" y="20">0</text><text x="{{ site.data.dublin_geography.scale5km }}" y="20" text-anchor="end">5 km</text></g>
  {% unless include.preview %}
  <g class="atlas-campuses" aria-label="大学校园参考位置">
    {% for campus in site.data.dublin_campuses %}
    {% assign position = site.data.dublin_geography.campuses | where: 'id', campus.id | first %}
    <g class="atlas-campus-marker" data-atlas-campus="{{ campus.id }}" role="button" tabindex="0" aria-label="定位 {{ campus.name }} {{ campus.subtitle }}" aria-pressed="false">
      <title>{{ campus.title }} · {{ campus.subtitle }}</title>
      <path d="M{{ position.x }},{{ position.y }} Q{{ position.label_x | minus: 65 }},{{ position.y }} {{ position.label_x }},{{ position.label_y }}" class="atlas-campus-leader"/>
      <circle cx="{{ position.x }}" cy="{{ position.y }}" r="7" class="atlas-campus-halo"/>
      <circle cx="{{ position.x }}" cy="{{ position.y }}" r="3" class="atlas-campus-dot"/>
      <rect x="{{ position.label_x }}" y="{{ position.label_y | minus: 16 }}" width="143" height="51" rx="10"/>
      <path d="M{{ position.label_x | plus: 10 }},{{ position.label_y | minus: 3 }} l12,-7 12,7 -12,7 Z m5,4 v8 q7,5 14,0 v-8" class="atlas-campus-cap" aria-hidden="true"/>
      <text x="{{ position.label_x | plus: 42 }}" y="{{ position.label_y }}">{{ campus.name }}</text>
      <text x="{{ position.label_x | plus: 42 }}" y="{{ position.label_y | plus: 16 }}" class="atlas-campus-subtitle">{% if campus.id == 'tcd' %}College Green{% else %}Belfield{% endif %}</text>
    </g>
    {% endfor %}
  </g>
  {% endunless %}
</svg>
