{% if site.reader_geography_url %}
<section id="reader-geography" class="reader-geography" aria-labelledby="reader-geography-title"
         data-endpoint="{{ site.reader_geography_url | escape }}"
         data-map="{{ '/assets/data/reader-countries.json' | relative_url }}">
  <h2 id="reader-geography-title">Reader Geography</h2>
  <p class="reader-geography-caption">Homepage visits by country or region</p>
  <canvas width="1440" height="580" role="img"
          aria-label="World map with countries and regions shaded where visits have been recorded">
    Recorded visits are summarized below the map.
  </canvas>
  <p class="reader-geography-status" role="status">Loading visit totals…</p>
  <ol class="reader-geography-regions" aria-label="Top regions by visits" hidden></ol>
</section>
<script src="{{ '/assets/js/reader-geography.js' | relative_url }}" defer></script>
{% endif %}
