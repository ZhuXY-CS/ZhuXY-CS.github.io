<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffafb">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ page.title | escape }} · ZY and I</title>
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/zy-and-i.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/css/zy-and-i-recipes.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/css/love-entry.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body class="love-page recipe-page">
    {% assign entry_script = page.entry_script | default: '/assets/js/zy-and-i-recipes.js' %}
    {% include love-entry.html script=entry_script %}
  </body>
</html>
