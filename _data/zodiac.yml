---
profiles:
- id: scorpio
  symbol: "♏"
  name: 小庸 · 天蝎座
  english: SCORPIO
  element: 水象 · 固定宫
  image: 深情有回声，认真有着落。
  intro: 天蝎的迷人，是安静里藏着很浓的感情。未必把所有心事挂在嘴边，却会对认定的人格外用心：留意细节，记住约定，也愿意一点点打开自己的内心。
  tags:
  - 深情
  - 专注
  - 敏锐
  - 坚定
  traits:
  - title: 爱得深，也愿意了解得深
    text: 不只喜欢热闹时的笑容，也想知道你为什么开心、最近在担心什么。比起停留在“今天做了什么”，更向往那种能聊到心里去的亲密。
  - title: 认真，是很有分量的浪漫
    text: 认定一件事，就愿意投入耐心和时间。放进爱情里，是把“以后一起”记在心上，再慢慢落实成下一次见面、一个小计划和日常的照顾。
  - title: 能看见不太显眼的温柔
    text: 会在意语气里的疲惫，也容易记住随口提过的小偏好。那份细致的吸引力，在于让一个人觉得：原来我的小事，也有人认真听。
  - title: 外表沉静，心里有热度
    text: 熟悉之前可能有一点距离感，亲近之后却有属于两个人的柔软。慢慢被信任、被接纳的过程，本身就很像一份只向你展开的礼物。
  - title: 遇到困难，愿意一起想办法
    text: 这份原型里的韧性，不只是坚持自己的目标，也可以是关系里的可靠：事情不顺时，仍愿意留下来，把问题听明白、把路一起找出来。
  love: 天蝎式的喜欢，像一句没有说得很响、却一直在兑现的“我在”。当这份深情遇见愿意回应它的人，安静也会变得很甜。
  receive: 喜欢被认真听见，也喜欢明确的回应。一句“你的用心我看到了”，就能让默默付出的温柔有着落。
  gift: 给这段关系的礼物：被放在心上的踏实。
- id: leo
  symbol: "♌"
  name: ZY · 狮子座
  english: LEO
  element: 火象 · 固定宫
  image: 明亮而真诚，热烈也柔软。
  intro: 狮子的迷人，是能把喜欢变得看得见。热情、坦率、有感染力，愿意为重要的人鼓掌，也愿意把普通日子过得有一点特别。那束光里，不只有自信，还有慷慨的真心。
  tags:
  - 热情
  - 真诚
  - 勇敢
  - 慷慨
  traits:
  - title: 喜欢你，就想把快乐分给你
    text: 一件好笑的小事、一张好看的照片、一个突然冒出来的念头，都可能成为分享的理由。热烈的表达让爱情有温度，也让“我们”自然地走进日常。
  - title: 会欣赏，也愿意为你撑腰
    text: 狮子式的重情义，是看见喜欢的人努力时，会真心觉得骄傲。在对方没那么有信心的时候，那句“我相信你”可以说得很坚定。
  - title: 把平常日子过出小小光彩
    text: 有创造力，也愿意花心思。一顿饭、一首歌、一句认真准备的话，都能变成值得记住的片刻。仪式感不是排场，而是“这件事因为你而特别”。
  - title: 有主见，也有靠近的勇气
    text: 知道自己喜欢什么，愿意表达期待，也愿意主动迈出一步。这样的勇敢会给关系带来活力，让心动不只停留在猜测里。
  - title: 发光的人，也有柔软的内心
    text: 明亮不代表永远不累，自信也不妨碍想被抱一抱。能够在喜欢的人面前放松下来，不用时时撑起气氛，是另一种很珍贵的亲密。
  love: 狮子式的喜欢，像把你拉进自己的阳光里：“这件开心的事，我想第一个告诉你。”被她热情地惦记，会让平凡的一天也亮起来。
  receive: 喜欢真诚、具体的欣赏，也喜欢被坚定选择。夸她的勇气与心意，也陪她度过不想发光的晚上。
  gift: 给这段关系的礼物：被热烈喜欢的幸福。
relationship:
- theme: 深情 × 热烈
  title: 一个把爱藏进细节，一个让爱有了回声
  text: 天蝎式的细腻，容易把关心做在小事里；狮子式的明亮，愿意把高兴和喜欢直接表达出来。当认真被看见、热情被珍惜，两种表达就能接成一个温暖的来回。
  scene: 你记得我随口说过的话，我也让你知道：被你记得，我很开心。
- theme: 坚定 × 坚定
  title: 都把重要的人，看得很重要
  text: 同属固定宫的文化意象，让这两个星座都有一份投入与坚持。用在爱情里，这份相似很动人：不是只喜欢心动的开头，也愿意给日复一日的陪伴留位置。
  scene: 下一次见面值得期待，今天这一点点陪伴，也同样算数。
- theme: 细腻 × 坦率
  title: 既能聊到心里，也能把喜欢说出来
  text: 一个擅长感受细微的情绪，一个为表达增加勇气。这样的组合，可以让关系既有深度，也有明朗的快乐：认真聊未来，也大大方方说想念。
  scene: 你可以讲那些不容易开口的心事，我也想把“好喜欢你”讲给你听。
- theme: 沉着 × 明亮
  title: 在彼此身边，找到另一种能量
  text: 深海与阳光不必互相改变。安静的陪伴能给热烈一个落脚处，轻快的分享也能给沉静带来新鲜空气。在一起，可以既有放松的片刻，也有一起出发的兴致。
  scene: 今天想出去看看世界，我们就一起计划；今天想慢一点，我们就一起歇一歇。
- theme: 欣赏 × 信任
  title: 你可以发光，也可以放心做自己
  text: 狮子式的勇气值得被欣赏，天蝎式的认真也值得被理解。彼此最好的加成，是既看见对方的本领，也珍惜对方柔软的一面。爱情于是多了一种底气：我不必完美，也能被好好喜欢。
  scene: 我为你的闪光点骄傲，也喜欢那个偶尔犯困、偶尔没电的你。
- theme: 心动 × 长久
  title: 既有恋人的火花，也有队友的默契
  text: 热情让相处有期待，专注让期待慢慢成为现实。这组搭配最值得向往的地方，是两个人可以一边保持心动，一边把“我们”过得更具体：分享生活、支持彼此、认真奔向下一次相见。
  scene: 我们不只适合说浪漫的话，也很适合一起过那些普通却珍贵的日子。
scenarios:
- title: 隔着距离，也能靠近
  words: "“今天没有什么大事，只是很想把我的一天分一点给你。”"
  note: 一张天空、一段语音、一句晚安，都可以让两座城市里的日常轻轻碰面。
- title: 为对方的闪光点鼓掌
  words: "“你认真做这件事的样子，真的很让我心动。”"
  note: 赞美有了具体的理由，就不只是一句好听的话，而是认真看见了对方。
- title: 累了，也有人接住
  words: "“今天不用那么厉害。你可以慢一点，我陪着你。”"
  note: 爱里很舒服的一刻，是不用努力表现，也知道自己仍然被欢迎。
- title: 把未来说得具体一点
  words: "“下次见面，第一件事是好好抱抱你，其他事情我们慢慢来。”"
  note: 期待不一定宏大。一起吃一顿饭、走一小段路，就已经很值得奔赴。
rituals:
- title: 交换今天的一点心动
  him: 告诉她今天哪个瞬间想起了她：路边的花、食堂的一道菜，或者突然听见的旋律。
  her: 送给他一个今天的小片段，让他也能走进你的日常。
  together: 各发一张照片，配一句“如果你在这里，我想……”。
  line: 相隔的只是两座城市，想分享生活的心，一直靠得很近。
- title: 给彼此一份专属夸奖
  him: 说说她最近哪一次勇敢或温柔，让你觉得特别喜欢。
  her: 告诉他哪一件不起眼的小事，让你觉得被认真放在了心上。
  together: 把“你好棒”说具体一点，再把这句话收藏起来。
  line: 你身上的光，我有认真看见；你藏起来的用心，我也有好好珍惜。
- title: 为下一次见面留个位置
  him: 收藏一个想带她去的地方，写下为什么想和她一起。
  her: 选一道想一起吃的菜，或者一件见面时想做的小事。
  together: 给“下次见面清单”添上一项，不赶进度，只添期待。
  line: 未来最可爱的样子，是计划里有你，而你也正在向我走来。
- title: 一起拥有一个慢慢的晚上
  him: 放下要把所有事情解决好的念头，问问她今晚想怎样放松。
  her: 不用负责让气氛一直热闹，想撒娇、想安静，都可以说出来。
  together: 找一个都方便的时间，聊聊或各做各的事，享受有人陪着。
  line: 在你身边，不必每一分钟都精彩，平静也可以是幸福。
- title: 给我们选一首背景音乐
  him: 挑一首想送给她的歌，说说哪一段旋律像你的心情。
  her: 回赠一首歌，让歌单多一份属于你的颜色。
  together: 同时按下播放，把这一首收进你们的共同歌单。
  line: 同一首歌在两边响起，今天就有了一小段属于我们的时间。
- title: 把“我在”变成一个小动作
  him: 问问她这周有什么值得期待的事，到时候记得再问一句。
  her: 也惦记一下他正在努力的事情，为一个小进展开心。
  together: 给彼此留一句“这件事我记着呢”，让支持有真实的回声。
  line: 喜欢不只发生在浪漫时刻，也发生在你认真惦记我的时候。
- title: 收藏一份被爱的证据
  him: 写下一件她做过、让你忍不住笑起来的小事。
  her: 也记下一次他的陪伴，或者一句让你安心的话。
  together: 交换一句“和你在一起，我很喜欢……”，留给以后的你们重读。
  line: 最想收藏的好运，是普通日子里，我们依然愿意认真地选择彼此。
