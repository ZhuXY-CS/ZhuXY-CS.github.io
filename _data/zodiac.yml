checked: "2026-09-14"
profiles:
  - id: scorpio
    symbol: "♏"
    name: "小庸 · 天蝎座男生"
    english: "SCORPIO"
    element: "水象 · 固定宫"
    image: "把喜欢，放进认真做的每一件小事。"
    strengths:
      - "专注而有韧性：在占星原型里，天蝎常被描绘为愿意钻研、把认定的事情坚持下去。"
      - "重视深度与信任：相比表面热闹，更向往真诚、可以交心的连接。"
      - "观察细致、投入认真：这份原型的温柔，是愿意看见别人不轻易说出口的感受。"
    edges:
      - "坚持也可能变成固执；不安时容易猜测，把心事留给自己。"
      - "在意不等于有权控制。比试探和查证更值得练习的，是直接表达需要、尊重对方的空间。"
    love: "如果你喜欢这种天蝎式的深情，不妨把“我已经做了”再加上一句“因为我很在乎你”。让付出被听见，也让她不用猜。"
    source: "https://www.astrology.com/zodiac-signs/scorpio"
  - id: leo
    symbol: "♌"
    name: "ZY · 狮子座女生"
    english: "LEO"
    element: "火象 · 固定宫"
    image: "把日子照亮，也值得被温柔照顾。"
    strengths:
      - "热情而有表达力：在占星原型里，狮子常被描绘为愿意主动分享快乐、鼓励身边的人。"
      - "慷慨、有创造力：愿意为喜欢的人准备心意，让普通日子多一点仪式感。"
      - "自信、勇敢、重情义：这个原型的光，不只在被看见，也在愿意为重要的人撑腰。"
    edges:
      - "自尊心强时，可能不容易示弱或承认受伤；坚持己见也可能让倾听变难。"
      - "喜欢被肯定很自然，但不必靠持续的赞美证明价值，也不必总是负责让大家开心。"
    love: "如果她认同这种狮子式的明亮，请夸到具体的一件事，也给她不必表现坚强的时刻。喜欢她发光，也愿意陪她休息。"
    source: "https://www.astrology.com/zodiac-signs/leo"
relationship:
  - title: "相似的认真，可以成为一支队伍"
    text: "通俗占星把你们都归为固定宫，强调投入和坚持。把这个象征用在生活里，就是一起守住约定，而不是在分歧里比谁更不肯退让。"
  - title: "一个喜欢深一点，一个喜欢亮一点"
    text: "水与火是占星里的比喻，不是相克定律。安静的陪伴和热烈的表达可以并存：先问对方今天需要哪一种，再把爱送到她或他接得到的地方。"
  - title: "被欣赏，也被信任"
    text: "配对文章常把认可与信任写成这组关系的主题。具体到你们，可以多说“我欣赏你做的这件事”，也多留一句“你有自己的安排，我尊重你”。"
  - title: "有火花，也需要给彼此台阶"
    text: "这组原型也被描述为有较劲的可能。关系不会因星座自动变好或变坏；争执时讨论具体事情，不把“你们天蝎／狮子都这样”当成结论。"
scenarios:
  - title: "异地，消息没及时回复"
    words: "“我有点想你，不是要催你。你方便的时候告诉我，今晚能不能聊一会儿？”"
    note: "把想念说出来，不把沉默直接翻译成不在乎。回复节奏由两个人商量。"
  - title: "她做成了一件小事"
    words: "“你刚才处理那件事的方式，我真的很欣赏。今晚想听你多讲一点。”"
    note: "赞美具体的努力与选择，而不只是外表；这样的肯定也同样适合送给他。"
  - title: "两个人都有一点委屈"
    words: "“这件事我有点难过，但我不是来和你分输赢的。我们先各说完，再一起想办法，好吗？”"
    note: "需要冷静就约好再聊的时间。暂停不是消失，和好也不是谁必须先认输。"
rituals:
  - title: "把想念说具体"
    him: "分享一个今天让你想到她的小细节，不需要等到有大事才联系。"
    her: "如果愿意，把今天最开心的一分钟讲给他听，普通的小事也值得被分享。"
    together: "各发一张今天的天空，再约一个双方都方便的通话时间。"
    line: "我喜欢的不是某一种星座，是那种星座里，刚好叫作你的那个人。"
  - title: "认真夸奖的一天"
    him: "夸她一个具体的选择：勇敢表达、认真学习，或者把自己照顾得很好。"
    her: "告诉他哪一件小事让你感到安心，让默默的用心也有回声。"
    together: "各补完一句“最近我最欣赏你的是……”。不比较谁说得更动听。"
    line: "愿我既是为你鼓掌的人，也是你不想发光时，可以靠一靠的人。"
  - title: "让约定慢慢发芽"
    him: "把一个惦记很久的小计划拆成今天能完成的一步，做完就允许自己休息。"
    her: "为一个想尝试的点子留一点时间，不必等到准备完美才开始。"
    together: "给下一次见面存一个地点或一道想一起吃的菜，不必现在就决定全部行程。"
    line: "未来不用一次说完，我们把它过成一个又一个兑现的小约定。"
  - title: "给彼此一点松弛"
    him: "心里有疑问时先问清楚，不替对方补写最坏的答案。"
    her: "累的时候可以直接说想休息，不必一直热情、漂亮或充满能量。"
    together: "互相问一句：“今天想聊聊，还是想安静地待一会儿？”"
    line: "在我这里，你不用一直是太阳；有一点阴天，也一样被喜欢。"
  - title: "共享一点新鲜感"
    him: "推荐一首歌，并告诉她是哪一句、哪个旋律让你想到你们。"
    her: "回赠一个自己的发现：一张照片、一段旋律，或者一件想一起尝试的小事。"
    together: "同时听一首歌，听完各说一个感受。距离不妨碍分享同一分钟。"
    line: "两座城市各有灯火，我想分享的那一盏，始终留给你。"
  - title: "温柔也可以很坚定"
    him: "把一个需要说清楚的感受写成“我希望……”，不用试探换取答案。"
    her: "表达自己的偏好，也留一点时间听完他的理由，不急着决定谁对谁错。"
    together: "挑一个小安排练习共同决定：谁方便、谁需要休息、怎样让两个人都舒服。"
    line: "我想站在你身边，不是替你决定方向，而是认真听你想去哪里。"
  - title: "收藏普通日子"
    him: "记下一件她最近做过、让你觉得温暖的小事，找个自然的时刻告诉她。"
    her: "也为自己记下一件值得高兴的事；你的快乐不必总和别人有关。"
    together: "各写一句这周想感谢对方的话，留到下次心情低落时再读。"
    line: "最想收藏的好运，是很多个普通日子里，我们都认真地选择彼此。"
