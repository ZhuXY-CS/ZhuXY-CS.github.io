# Home-cooking reference methods; time includes preparation unless noted.
groups:
  - id: ziyu
    title: "紫雨的日常饭菜"
    description: "记录紫雨平常做的饭菜。"
  - id: xiaoyong
    title: "小庸想带紫雨吃的"
    description: "小庸平常吃到的味道，想在将来和紫雨一起分享。"
recipes:
  - id: tomato-egg-noodles
    group: ziyu
    name: "西红柿鸡蛋面"
    image: "/images/zy-and-i/recipes/tomato-egg-noodles.png"
    image_alt: "西红柿鸡蛋面美食插画：番茄汤底中有面条、鸡蛋、鸡腿肉和葱花"
    ingredients:
      - "西红柿"
      - "鸡蛋"
      - "鸡腿肉"
      - "面条"
      - "葱花"
    estimated_time: "25–35 分钟"
    steps:
      - "西红柿切块，鸡蛋打散，鸡腿肉去骨切小块，用少许盐和生抽拌匀。"
      - "少油炒熟鸡蛋，盛出；再下鸡腿肉炒至表面变色。"
      - "放西红柿炒 3–5 分钟至出汁，加热水煮沸，再煮 5–8 分钟。"
      - "下面条，按包装时间煮熟，同时确认鸡肉熟透；放回鸡蛋，加盐调味，撒葱花。"
  - id: tomato-potato-beef
    group: ziyu
    name: "番茄土豆烧牛肉"
    image: "/images/zy-and-i/recipes/tomato-potato-beef.png"
    image_alt: "番茄土豆烧牛肉美食插画：牛肉块、土豆和西红柿裹着浓稠酱汁，点缀香菜"
    ingredients:
      - "西红柿"
      - "土豆"
      - "牛肉"
      - "香菜"
    estimated_time: "约 1.5–2 小时（普通炖锅）"
    steps:
      - "牛肉选适合炖煮的部位，切成约 2–3 厘米的块；番茄、土豆切块，香菜切碎。"
      - "牛肉冷水下锅，煮沸撇沫，捞出沥干。"
      - "少油炒番茄至出汁，加入牛肉和少量生抽翻匀，加没过牛肉的热水。"
      - "小火加盖炖 60–90 分钟至牛肉软熟，水少时补热水。"
      - "加土豆再炖 15–20 分钟至软熟，加盐调味，略收汁，撒香菜。"
  - id: tomato-scrambled-eggs
    group: ziyu
    name: "西红柿炒鸡蛋"
    image: "/images/zy-and-i/recipes/tomato-scrambled-eggs.png"
    image_alt: "西红柿炒鸡蛋美食插画：红色西红柿块与金黄色炒鸡蛋裹着少量番茄汁"
    ingredients:
      - "西红柿"
      - "鸡蛋"
    estimated_time: "15–20 分钟"
    steps:
      - "西红柿切块，鸡蛋打散加少许盐。"
      - "热锅放油，倒蛋液炒至凝固成块，盛出。"
      - "补少许油，下西红柿炒 3–5 分钟至软、出汁，偏酸时可加少量糖。"
      - "放回鸡蛋，轻翻 1–2 分钟，加盐调味，略收汁即可。"
  - id: carrot-beef-wrap
    group: ziyu
    name: "胡萝卜牛肉卷馍"
    image: "/images/zy-and-i/recipes/carrot-beef-wrap.png"
    image_alt: "胡萝卜牛肉卷馍美食插画：柔软的馍卷着胡萝卜条、牛肉和沙拉酱，开口露出馅料"
    ingredients:
      - "馍"
      - "胡萝卜"
      - "牛肉"
      - "沙拉酱"
    estimated_time: "25–35 分钟（现成馍皮）"
    steps:
      - "胡萝卜切丝，牛肉逆纹切条，用少量生抽、淀粉和油腌约 10 分钟。"
      - "热锅放油，将牛肉炒熟后盛出。"
      - "胡萝卜丝炒 3–5 分钟至软熟，可加一小勺水帮助焖软。"
      - "馍皮用平底锅小火热软，铺牛肉和胡萝卜，稍放凉后挤沙拉酱，折起底部再卷紧。"
  - id: salt-baked-chicken-thighs
    group: ziyu
    name: "盐焗鸡腿"
    image: "/images/zy-and-i/recipes/salt-baked-chicken-thighs.png"
    image_alt: "盐焗鸡腿美食插画：不锈钢碗里盛着带淡金色鸡皮的熟鸡腿肉"
    ingredients:
      - "鸡腿"
    estimated_time: "60–75 分钟（含腌制，盐焗粉蒸制版）"
    steps:
      - "鸡腿擦干，在肉厚处划几刀；另备盐焗鸡粉，按包装用量涂匀，可拌少量油。"
      - "放冰箱腌约 20–30 分钟。"
      - "鸡腿放耐热盘中，蒸锅水沸后中火蒸 25–35 分钟，大鸡腿适当延长。"
      - "关火焖 5 分钟；用温度计确认最厚处达到 74°C，探针避开骨头。稍放凉后整只装盘或撕开。"
  - id: tomato-egg-lettuce-noodles
    group: ziyu
    name: "西红柿鸡蛋生菜面"
    image: "/images/zy-and-i/recipes/tomato-egg-lettuce-noodles.png"
    image_alt: "西红柿鸡蛋生菜面美食插画：番茄汤汁中的面条和鸡蛋，搭配大片浅绿色叶菜"
    ingredients:
      - "西红柿"
      - "鸡蛋"
      - "生菜"
      - "面条"
    estimated_time: "20–25 分钟"
    steps:
      - "西红柿切块，鸡蛋打散，生菜洗净。"
      - "少油炒熟鸡蛋盛出，再炒西红柿至软、出汁。"
      - "加热水煮沸，下面条，按包装时间煮熟。"
      - "放回鸡蛋，加盐或少量生抽；最后放生菜，煮约 30–60 秒至断生即可。"
  - id: mala-dry-pot
    group: ziyu
    name: "麻辣香锅"
    image: "/images/zy-and-i/recipes/mala-dry-pot.png"
    image_alt: "麻辣香锅美食插画：鸡腿肉、鸡蛋、土豆、西兰花、培根、白菜和蘑菇在黑色炒锅中混炒"
    ingredients:
      - "鸡腿肉"
      - "鸡蛋"
      - "土豆"
      - "西兰花"
      - "培根"
      - "白菜"
      - "蘑菇"
    estimated_time: "35–45 分钟"
    steps:
      - "鸡腿肉去骨切块，培根切片，土豆切薄片，西兰花掰小朵，白菜和蘑菇切好；另备麻辣香锅调料。"
      - "鸡蛋煮熟剥壳切半；土豆、西兰花分别焯至基本熟透，沥干。"
      - "少油炒熟鸡腿肉，再下培根煸香；鸡肉中心应达到 74°C。"
      - "转中小火，按包装用量加入香锅调料炒香，放蘑菇、白菜炒熟，必要时加一小勺水。"
      - "放其余食材翻炒 2–3 分钟，裹匀酱汁；调料已有盐，尝味后再决定是否加盐。"
  - id: bacon-noodle-soup
    group: ziyu
    name: "培根素面"
    image: "/images/zy-and-i/recipes/bacon-noodle-soup.png"
    image_alt: "培根素面美食插画：清汤细面搭配粉红色培根片、绿色青菜和鸡蛋"
    ingredients:
      - "面条"
      - "培根"
      - "青菜"
      - "鸡蛋"
    estimated_time: "15–20 分钟"
    steps:
      - "培根切段，青菜洗净，鸡蛋打散。"
      - "汤锅少油煎熟培根，加热水煮沸。"
      - "下面条，按包装时间煮至接近熟透。"
      - "加青菜煮至断生，再缓慢淋蛋液，待蛋花凝固熟透。尝味后加少量盐或生抽即可。"
  - id: chicken-vegetable-rice-box
    group: ziyu
    name: "鸡肉素盒饭"
    image: "/images/zy-and-i/recipes/chicken-vegetable-rice-box.png"
    image_alt: "鸡肉素盒饭美食插画：透明玻璃饭盒内盛着鸡肉、白米饭、西兰花和胡萝卜丝"
    ingredients:
      - "鸡肉"
      - "西兰花"
      - "胡萝卜"
      - "米饭"
    estimated_time: "35–45 分钟（生米起做；熟米饭版 20–25 分钟）"
    steps:
      - "先按电饭煲说明煮米饭，同时将鸡肉切薄片、西兰花掰小朵、胡萝卜切丝。"
      - "鸡肉用少许盐、生抽、胡椒拌匀，腌约 10 分钟。"
      - "西兰花沸水煮 2–3 分钟至断生；胡萝卜丝少油炒软。"
      - "鸡肉少油煎至两面熟透，厚片适当延长，中心应达到 74°C。"
      - "饭盒里装入米饭、鸡肉和蔬菜；留作下一餐时及时冷藏，吃前充分加热。"
  - id: tomato-egg-grilled-cold-noodles
    group: ziyu
    name: "西红柿鸡蛋烤冷面"
    image: "/images/zy-and-i/recipes/tomato-egg-grilled-cold-noodles.png"
    image_alt: "西红柿鸡蛋烤冷面美食插画：白盘里的金黄色烤冷面片、鸡蛋、红色番茄和绿色香菜"
    ingredients:
      - "西红柿"
      - "鸡蛋"
      - "烤冷面"
      - "香菜"
    estimated_time: "15–20 分钟"
    steps:
      - "西红柿切薄块，香菜洗净切段，鸡蛋打散；另备少量烤冷面酱或喜欢的酱汁。"
      - "平底锅刷油，放烤冷面片，中小火煎热，沿边撒少量水让面片软化。"
      - "倒蛋液摊开，稍凝固后翻面，煎至鸡蛋熟透。"
      - "刷薄酱汁，切成宽条或小块；西红柿可在锅边炒软，也可洗净后直接搭配。"
      - "装盘铺西红柿和香菜，按口味补少量酱汁。"
  - id: sweet-sour-meatballs
    group: xiaoyong
    name: "糖醋丸子"
    image: "/images/zy-and-i/recipes/sweet-sour-meatballs.png"
    image_alt: "山西风味糖醋丸子：白色方盘中的酥炸肉丸裹着红亮糖醋汁"
    ingredients:
      - "去皮五花肉"
      - "红薯淀粉"
      - "葱"
      - "姜"
      - "八角（大料）"
      - "番茄酱"
      - "米醋"
      - "白糖"
    note: "小庸甄选 · 山西特色美食，想和紫雨一起尝的酸甜滋味。"
    estimated_time: "45–60 分钟（约 2 人份）"
    steps:
      - "去皮五花肉约 300 克切小块，剁成细肉馅；葱、姜切末备用。另将少量葱段、姜片和八角用热水浸泡 10–15 分钟，滤出放凉。"
      - "肉馅加少量盐、白胡椒粉、五香粉、生抽；鸡精和酱油可按口味少量添加。将约 40–60 毫升葱姜大料水分次加入，同方向搅拌，待每次水被吸收后再加，搅至黏稠上劲。"
      - "加入红薯淀粉约 30–40 克和少许香油拌匀；淀粉按肉馅含水量调整，以能挤成丸子、不松散为准。挤成直径约 2–3 厘米的小丸子。"
      - "锅中油温约 160–170°C，分批下丸子，中火炸约 5–7 分钟至熟透；不要一次下太多。捞出后将油温升至约 180°C，复炸 30–60 秒至表面金黄酥脆，控油。实际时间随丸子大小调整。"
      - "小碗混合番茄酱 2 汤匙、米醋 2 汤匙、白糖 1.5–2 汤匙、清水 4 汤匙和一小撮盐。这是家庭参考比例，按喜欢的酸甜度调整。另用 1 茶匙淀粉加 2 茶匙水调成水淀粉。"
      - "锅中留少许底油，炒香葱姜末，倒入糖醋汁，中小火煮沸约 1 分钟；少量多次淋入水淀粉，搅至酱汁稍稠、冒泡。"
      - "倒入炸好的丸子，快速翻拌至均匀裹汁，立即出锅，趁热吃更酥香。做法根据提供的美味小舍视频截图与摘要整理；用量和用时为家庭参考估算。"
  - id: hula-soup
    group: xiaoyong
    name: "胡辣汤"
    image: "/images/zy-and-i/recipes/hula-soup.png"
    image_alt: "胡辣汤美食插画：浓稠汤底中有木耳、鸡蛋丝、瘦肉和小米，点缀香菜"
    ingredients:
      - "木耳"
      - "鸡蛋"
      - "瘦肉"
      - "牛骨头"
      - "小米"
      - "香菜"
    estimated_time: "已有骨汤：35–45 分钟；现熬汤另加 3–5 小时"
    steps:
      - "这是按已记录食材整理的家常参考版。木耳提前泡发洗净切丝，小米淘洗，瘦肉切细丝，鸡蛋打散。"
      - "牛骨焯水后换清水，小火熬 3–5 小时，滤去骨头和碎屑；也可使用提前熬好的骨汤。"
      - "骨汤煮沸，下小米煮 20–25 分钟至软熟，再下木耳煮 3–5 分钟。"
      - "加入瘦肉丝搅散煮熟，用盐、胡椒粉和少量辣椒粉调味；想更稠时少量多次加水淀粉并煮透。"
      - "慢慢淋入蛋液，蛋花熟透后关火，撒香菜，按口味加香醋。"
  - id: sausage-crispy-rice
    group: xiaoyong
    name: "香肠锅巴饭"
    image: "/images/zy-and-i/recipes/sausage-crispy-rice.png"
    image_alt: "香肠锅巴饭美食插画：圆锅中的米饭铺着香肠片，锅边有金黄色锅巴"
    ingredients:
      - "香肠"
      - "米饭"
    made_by: "小庸的小姨"
    note: "小姨说，等紫雨来，她做给紫雨吃。"
    estimated_time: "20–30 分钟（熟米饭版）"
    steps:
      - "这是家常平底锅参考版，小姨的具体做法以后再记录。熟米饭备好，香肠切片；生香肠须先按包装要求蒸熟或煮熟。"
      - "厚底不粘锅刷薄油，铺熟米饭压平，放上熟香肠片。"
      - "沿锅边加 1–2 汤匙水，加盖小火焖 5–8 分钟，使食材热透。"
      - "揭盖，小火煎 8–12 分钟至底部形成金黄锅巴，按锅具调整，避免烧焦。"
      - "关火焖 2 分钟，沿边轻轻松开；香肠有咸味，酱油酌情少加。"
  - id: taihe-beef-noodles
    group: xiaoyong
    name: "太和板面"
    image: "/images/zy-and-i/recipes/taihe-beef-noodles.png"
    image_alt: "太和板面美食插画：宽板面搭配牛肉块、整根辣椒和白菜，盛在黄褐色陶碗中"
    ingredients:
      - "牛肉"
      - "辣椒"
      - "白菜"
      - "板面"
    location: "翠庭院门口"
    estimated_time: "约 1.5–2 小时（现炖牛肉；已有卤牛肉 15–20 分钟）"
    steps:
      - "这是家常参考版，使用现成板面。牛肉切小块，干辣椒剪口，白菜洗净切段。"
      - "牛肉冷水焯去浮沫后捞出；另锅少油小火炒香辣椒，勿炒糊，再加牛肉翻炒。"
      - "加少量生抽、盐和足量热水，可另加八角等炖肉香料，小火炖 60–90 分钟至软熟。"
      - "另锅煮板面，按包装时间煮熟，最后下白菜煮至断生。"
      - "面和白菜装碗，浇牛肉、辣椒和汤汁。已有卤牛肉时，将其放入辣椒汤中热透即可。"
  - id: lulu-wrap
    group: xiaoyong
    name: "噜噜卷馍"
    image: "/images/zy-and-i/recipes/lulu-wrap.png"
    image_alt: "噜噜卷馍备料美食插画：薄馍皮、千张丝、土豆丝和鸡蛋，搭配老干妈、辣椒面和芝麻"
    ingredients:
      - "卷馍"
      - "千张丝"
      - "土豆丝"
      - "鸡蛋"
      - "老干妈"
      - "辣椒面"
      - "芝麻"
    made_by: "小庸自己烹饪"
    estimated_time: "25–35 分钟（现成卷馍皮）"
    steps:
      - "土豆丝冲去表面淀粉，千张切丝，鸡蛋打散；老干妈、辣椒面和熟芝麻备用。"
      - "少油炒熟鸡蛋盛出；千张丝沸水焯 1–2 分钟，沥干。"
      - "土豆丝少油炒 3–5 分钟至熟，加千张丝翻匀，少量加盐。"
      - "卷馍皮小火热软，薄抹老干妈，铺土豆丝、千张丝和炒鸡蛋。"
      - "撒少量辣椒面和熟芝麻，折起底部，两侧内收，卷紧即可。"
