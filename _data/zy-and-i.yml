# 左下角情话卡片，点击按钮依次阅读。
sweet_notes:
  - text: "我们分担寒潮、风雷、霹雳；我们共享雾霭、流岚、虹霓。"
    attribution: "舒婷《致橡树》"
    source: "https://www.gushiwen.cn/shiwenv_3eebdc329a26.aspx"
  - text: "相爱，是一起望向同一个方向。"
    attribution: "圣埃克苏佩里《人的大地》· 节译"
    source: "https://fr.wikiquote.org/wiki/Terre_des_hommes"
  - text: "祝你今天愉快。你明天的愉快留着我明天再祝。"
    attribution: "王小波《爱你就像爱生命》"
    source: "https://www.megbook.com.tw/mall/detail.jsp?proID=2777752"
  - text: "醒来觉得甚是爱你。"
    attribution: "朱生豪 · 致宋清如"
    source: "https://www.lifeweek.com.cn/h5/article/detail?artId=78405"
  - text: "不要愁老之将至，你老了一定很可爱。"
    attribution: "朱生豪 · 致宋清如"
    source: "https://www.sohu.com/a/373336218_650625"
  - text: "两情若是久长时，又岂在朝朝暮暮。"
    attribution: "秦观《鹊桥仙·纤云弄巧》"
    source: "https://www.gushiwen.cn/mingju/juv_777764b0d152.aspx"
  - text: "宜言饮酒，与子偕老。琴瑟在御，莫不静好。"
    attribution: "《诗经·郑风·女曰鸡鸣》"
    source: "https://www.gushiwen.cn/mingju/juv_7a543652a36d.aspx"
  - text: "家人闲坐，灯火可亲。"
    attribution: "汪曾祺《冬天》"
    source: "https://www.thepaper.cn/newsDetail_forward_30070239"
  - text: "我将永远忠于自己，披星戴月奔向理想和你。"
    attribution: "网络流传"
    source: "https://k.sina.com.cn/article_3237071730_pc0f1cb7202700kuv6.html"
  - text: "最好的关系，是各自忙碌，又互相牵挂。"
    attribution: "网络流传 · 节选"
    source: "https://www.douyin.com/video/7617484234730582248"
  - text: "我们要一起比肩而立成为更好的大人。"
    attribution: "网络流传"
    source: "https://www.ruiwen.com/wenan/4647541.html"
  - text: "你是我明目张胆的偏爱，是我众所周知的私心。"
    attribution: "网络流传"
    source: "https://wenan.5186a.com/wenan/18973.html"
  - text: "我喜欢你，胜于昨日，略匮明朝。"
    attribution: "网络流传"
    source: "https://k.sina.cn/article_5856115080_p15d0d398802700o7rf.html"
  - text: "第一次看到宇宙，是和你四目相对的时候。"
    attribution: "网络流传"
    source: "https://www.zhihu.com/tardis/sogou/qus/379868410"
  - text: "身无彩凤双飞翼，心有灵犀一点通。"
    attribution: "李商隐《无题·昨夜星辰昨夜风》"
    source: "https://www.gushiwen.cn/mingju/juv_5b12ce0a3539.aspx"
  - text: "既见君子，云胡不喜。"
    attribution: "《诗经·郑风·风雨》"
    source: "https://www.gushiwen.cn/mingju/juv_885619ee0ef3.aspx"
  - text: "结发为夫妻，恩爱两不疑。"
    attribution: "《留别妻》· 旧题苏武"
    source: "https://m.gushiwen.cn/mingju/juv_043f0a1116f2.aspx"
  - text: "想和你分享的，从来不只是好消息。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "愿得一心人，白头不相离。"
    attribution: "《白头吟》"
    source: "https://www.shidianguji.com/zh/mingju/7624165785582059570"
  - text: "三愿如同梁上燕，岁岁长相见。"
    attribution: "冯延巳《长命女·春日宴》"
    source: "https://www.gushiwen.cn/shiwenv_f4af51f1f7ef.aspx"
  - text: "今夕何夕，见此良人？"
    attribution: "《诗经·唐风·绸缪》"
    source: "https://www.gushiwen.cn/mingju/juv_76ae1686eab3.aspx"
  - text: "今天路边的花开了，我的第一反应是拍给你。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "知子之来之，杂佩以赠之。"
    attribution: "《诗经·郑风·女曰鸡鸣》"
    source: "https://m.gushiwen.cn/mingju/juv_565ca77a33c1.aspx"
  - text: "邂逅相遇，与子偕臧。"
    attribution: "《诗经·郑风·野有蔓草》"
    source: "https://www.gushiwen.cn/mingju/juv_5b01dca61c2c.aspx"
  - text: "桃之夭夭，灼灼其华。"
    attribution: "《诗经·周南·桃夭》"
    source: "https://www.gushiwen.cn/mingju_1371.aspx"
  - text: "见面后的第一件事，想把手机收起来，好好抱你。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "投我以木桃，报之以琼瑶。"
    attribution: "《诗经·卫风·木瓜》"
    source: "https://www.gushiwen.cn/shiwenv.aspx?id=478043ea449a"
  - text: "彼美孟姜，洵美且都。"
    attribution: "《诗经·郑风·有女同车》"
    source: "https://www.gushiwen.cn/shiwenv_105d08a95e7d.aspx"
  - text: "君子万年，福禄宜之。"
    attribution: "《诗经·小雅·鸳鸯》"
    source: "https://m.gushiwen.cn/mingju/juv_e944a367c67c.aspx"
  - text: "想和你把散步走成习惯，把晚安说到很老。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "只愿君心似我心，定不负相思意。"
    attribution: "李之仪《卜算子·我住长江头》"
    source: "https://www.gushiwen.cn/mingju/juv_c3ecb42ab3d7.aspx"
  - text: "金风玉露一相逢，便胜却人间无数。"
    attribution: "秦观《鹊桥仙·纤云弄巧》"
    source: "https://www.gushiwen.cn/mingju/juv_452ff7c370b7.aspx"
  - text: "愿我如星君如月，夜夜流光相皎洁。"
    attribution: "范成大《车遥遥篇》"
    source: "https://k.sina.cn/article_5328858693_13d9fee4502001kdb6.html"
  - text: "你去试试，我会认真听你的新计划。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "愿身能似月亭亭，千里伴君行。"
    attribution: "张先《江南柳·隋堤远》"
    source: "https://m.gushiwen.cn/mingju/juv_a88deaeaf3b3.aspx"
  - text: "愿天上人间，占得欢娱，年年今夜。"
    attribution: "柳永《二郎神·炎光谢》"
    source: "https://m.gushici.net/ju/47/1119.html"
  - text: "愿得长如此，年年物候新。"
    attribution: "卢照邻《元日述怀》"
    source: "https://xgushiciw.com/classics/yuan-de-zhang-ru-ci-nian-nian-wu-hou-xin"
  - text: "你不用每次都赢，回来的时候照样有拥抱。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "何当共剪西窗烛，却话巴山夜雨时。"
    attribution: "李商隐《夜雨寄北》"
    source: "https://www.gushiwen.cn/mingju/juv_e9493bbacf84.aspx"
  - text: "但愿人长久，千里共婵娟。"
    attribution: "苏轼《水调歌头·明月几时有》"
    source: "https://m.gushiwen.cn/mingju/juv_f907abbd9ffc.aspx"
  - text: "和羞走，倚门回首，却把青梅嗅。"
    attribution: "李清照《点绛唇·蹴罢秋千》"
    source: "https://m.gushiwen.cn/mingju/juv_8dd98d69bfb8.aspx"
  - text: "你为我高兴的时候，我觉得快乐真的能变成两份。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "春日游，杏花吹满头。"
    attribution: "韦庄《思帝乡·春日游》"
    source: "https://m.gushiwen.cn/mingju/juv_38a8aac2b551.aspx"
  - text: "蓦然回首，那人却在，灯火阑珊处。"
    attribution: "辛弃疾《青玉案·元夕》"
    source: "https://www.gushiwen.cn/mingju/juv_4b183f3f8ce9.aspx"
  - text: "长风破浪会有时，直挂云帆济沧海。"
    attribution: "李白《行路难·其一》"
    source: "https://m.gushiwen.cn/gushiwen_072a8eb9f0.aspx"
  - text: "愿我们都能成为喜欢的自己，也一直喜欢彼此。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"
    attribution: "苏轼《定风波·莫听穿林打叶声》"
    source: "https://www.shidianguji.com/zh/mingju/7623382689550368818"
  - text: "莫道桑榆晚，为霞尚满天。"
    attribution: "刘禹锡《酬乐天咏老见示》"
    source: "https://m.gushiwen.cn/mingju/juv_4350cf60c665.aspx"
  - text: "千磨万击还坚劲，任尔东西南北风。"
    attribution: "郑燮《竹石》"
    source: "https://www.gushiwen.cn/mingju/juv.aspx?id=8d743552e647"
  - text: "你可以慢慢说，我想听懂，而不是急着回答。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "山重水复疑无路，柳暗花明又一村。"
    attribution: "陆游《游山西村》"
    source: "https://www.gushiwen.cn/mingju/juv_861088287ca4.aspx"
  - text: "且将新火试新茶。诗酒趁年华。"
    attribution: "苏轼《望江南·超然台作》"
    source: "https://szb.mshw.net/page/1/2023-08/19/03/2023081903_pdf.pdf"
  - text: "行到水穷处，坐看云起时。"
    attribution: "王维《终南别业》"
    source: "https://www.bjwmb.gov.cn/zxfw/wmwx/wskt/t20180823_878402.htm"
  - text: "再熟悉也想认真约会，再忙也想好好道别。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "一想到你，我这张丑脸上就泛起微笑。"
    attribution: "王小波《爱你就像爱生命》· 节选"
    source: "https://www.sohu.com/a/255101590_274569"
  - text: "只爱过一个正当最好年龄的人。"
    attribution: "沈从文《湘行书简》· 节选"
    source: "https://tsg.zjjc.edu.cn/u/cms/tsg/202312/28175642f4ez.pdf"
  - text: "只想倚在你肩上听你讲话。"
    attribution: "朱生豪 · 致宋清如 · 节选"
    source: "https://k.sina.cn/article_1655945975_62b3baf700100dmjh.html"
  - text: "这边天亮了，给还在梦里的你留一个轻轻的吻。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "匪女之为美，美人之贻。"
    attribution: "《诗经·邶风·静女》"
    source: "https://www.gushiwen.cn/mingju/juv_acee56f49c60.aspx"
  - text: "想和你拥有一个家，杯子可以不同，热茶总有两份。"
    attribution: "原创 · 写给你"
    source: ""
