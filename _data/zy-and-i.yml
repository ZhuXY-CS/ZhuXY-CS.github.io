# 左下角情话卡片，点击按钮依次阅读。
sweet_notes:
  - text: "我们分担寒潮、风雷、霹雳；我们共享雾霭、流岚、虹霓。"
    attribution: "舒婷《致橡树》"
    source: "https://www.gushiwen.cn/shiwenv_3eebdc329a26.aspx"
  - text: "相爱，是一起望向同一个方向。"
    attribution: "圣埃克苏佩里《人的大地》· 节译"
    source: "https://fr.wikiquote.org/wiki/Terre_des_hommes"
  - text: "祝你今天愉快。你明天的愉快留着我明天再祝。"
    attribution: "王小波《爱你就像爱生命》"
    source: "https://www.megbook.com.tw/mall/detail.jsp?proID=2777752"
  - text: "醒来觉得甚是爱你。"
    attribution: "朱生豪 · 致宋清如"
    source: "https://www.lifeweek.com.cn/h5/article/detail?artId=78405"
  - text: "不要愁老之将至，你老了一定很可爱。"
    attribution: "朱生豪 · 致宋清如"
    source: "https://www.sohu.com/a/373336218_650625"
  - text: "两情若是久长时，又岂在朝朝暮暮。"
    attribution: "秦观《鹊桥仙·纤云弄巧》"
    source: "https://www.gushiwen.cn/mingju/juv_777764b0d152.aspx"
  - text: "宜言饮酒，与子偕老。琴瑟在御，莫不静好。"
    attribution: "《诗经·郑风·女曰鸡鸣》"
    source: "https://www.gushiwen.cn/mingju/juv_7a543652a36d.aspx"
  - text: "家人闲坐，灯火可亲。"
    attribution: "汪曾祺《冬天》"
    source: "https://www.thepaper.cn/newsDetail_forward_30070239"
  - text: "我将永远忠于自己，披星戴月奔向理想和你。"
    attribution: "网络流传"
    source: "https://k.sina.com.cn/article_3237071730_pc0f1cb7202700kuv6.html"
  - text: "最好的关系，是各自忙碌，又互相牵挂。"
    attribution: "网络流传 · 节选"
    source: "https://www.douyin.com/video/7617484234730582248"
  - text: "我们要一起比肩而立成为更好的大人。"
    attribution: "网络流传"
    source: "https://www.ruiwen.com/wenan/4647541.html"
  - text: "你是我明目张胆的偏爱，是我众所周知的私心。"
    attribution: "网络流传"
    source: "https://wenan.5186a.com/wenan/18973.html"
  - text: "我喜欢你，胜于昨日，略匮明朝。"
    attribution: "网络流传"
    source: "https://k.sina.cn/article_5856115080_p15d0d398802700o7rf.html"
  - text: "第一次看到宇宙，是和你四目相对的时候。"
    attribution: "网络流传"
    source: "https://www.zhihu.com/tardis/sogou/qus/379868410"
  - text: "身无彩凤双飞翼，心有灵犀一点通。"
    attribution: "李商隐《无题·昨夜星辰昨夜风》"
    source: "https://www.gushiwen.cn/mingju/juv_5b12ce0a3539.aspx"
  - text: "想和你分享的，从来不只是好消息。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "今天路边的花开了，我的第一反应是拍给你。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "和你吃过的普通晚饭，我也会记很久。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "想你的时候，连输入框都像一扇小小的门。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "见面后的第一件事，想把手机收起来，好好抱你。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你认真讲小事的样子，让我的一天也有了光。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "我已经开始期待，下一次并肩走路时的风。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "留给你的那一口甜，是吃之前就想好的。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "购物清单上多了你爱吃的东西，我很喜欢这种变化。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "想和你把散步走成习惯，把晚安说到很老。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你的名字出现在屏幕上，普通的一天就有了小惊喜。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "既见君子，云胡不喜。"
    attribution: "《诗经·郑风·风雨》"
    source: "https://www.gushiwen.cn/mingju/juv_885619ee0ef3.aspx"
  - text: "下次见面，想听你把最近的开心再讲一遍。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你去试试，我会认真听你的新计划。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你的梦想值得被认真对待，我也想为它留一盏灯。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "今天只往前走了一小步，也值得我们碰个杯。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你不用每次都赢，回来的时候照样有拥抱。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "遇到难题，我们可以一起想；想不出来，就先一起吃饭。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "我喜欢你发光，也愿意陪你慢慢找回力气。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你为我高兴的时候，我觉得快乐真的能变成两份。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "我们轮流做那个说“再试一次吧”的人。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "想陪你庆祝大事，也记得你每一次小小的进步。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你专心做喜欢的事，我会连同那份认真一起喜欢。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "结发为夫妻，恩爱两不疑。"
    attribution: "《留别妻》· 旧题苏武"
    source: "https://m.gushiwen.cn/mingju/juv_043f0a1116f2.aspx"
  - text: "未来的计划里，有我们的家，也有各自想去的远方。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "愿我们都能成为喜欢的自己，也一直喜欢彼此。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "今天不想逞强的话，就把真实的心情带给我。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "你可以慢慢说，我想听懂，而不是急着回答。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "意见不同的时候，也想记得牵着你的手。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "有些委屈当时说不出口，晚一点告诉我也可以。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "我们把误会说开，把晚饭吃热，把彼此放在心上。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "愿我们说“我在”时，真的愿意停下来听一听。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "想把“谢谢你”和“我爱你”，都说得勤一点。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "再熟悉也想认真约会，再忙也想好好道别。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "隔着时差，也想让你醒来时有一句早安可收。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "愿得一心人，白头不相离。"
    attribution: "《白头吟》"
    source: "https://www.shidianguji.com/zh/mingju/7624165785582059570"
  - text: "这边天亮了，给还在梦里的你留一个轻轻的吻。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "我们把见不到面的日子，过成下次见面的故事。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "距离让拥抱晚了一点，却让我更珍惜见面的那一刻。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "我在认真过今天，也在认真期待与你重逢。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "视频挂断以后，你的笑还会在我的房间里待一会儿。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "想和你拥有一个家，杯子可以不同，热茶总有两份。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "雨天的愿望很小：一把伞，两个人，慢一点走。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "以后一起买菜吧，今天听你的，明天换我下厨。"
    attribution: "原创 · 写给你"
    source: ""
  - text: "等我们白发苍苍，还想拉你去看今年新开的花。"
    attribution: "原创 · 写给你"
    source: ""
