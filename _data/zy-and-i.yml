# Add the final copy here when it is ready. Each item is revealed in order.
# Set emphasis: true for the mulberry-colored lines.
story:
  - text: "ZY，"
  - text: "人海茫茫，有幸遇见。"
  - text: "不早不晚，刚好是你。"
  - text: "平生一顾，至此终年。"
  - text: "晴时并肩，雨时撑伞；"
    new_paragraph: true
  - text: "心动是你，心安亦然。"
  - text: "岁月为笔，相思入墨。"
  - text: "不辞青山，相随与共。"
    new_paragraph: true
  - text: "但心坚定，天长地久。"
  - text: "何愁意在，朝雨暮云。"
  - text: "生死契阔，与子成说。"
  - text: "执子之手，与子偕老。"
    new_paragraph: true
  - text: "Whatever comes, wherever life takes us,"
    new_paragraph: true
  - text: "I will keep choosing you"
  - text: "in every season, in every lifetime."
  - text: "一直爱你的 小庸"
    emphasis: true
    new_paragraph: true

